<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="pragma" content="no-cache" />
  <meta http-equiv="expires" content="0" />
  <title>CAPD Admin Panel - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="w-full max-w-md mx-auto px-4">
    <!-- Logo/Header -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-white mb-2">CAPD</h1>
      <p class="text-purple-100">Content Management System</p>
    </div>

    <!-- Login Form -->
    <div class="bg-white rounded-lg shadow-2xl p-8">
      <h2 class="text-2xl font-bold text-gray-800 mb-6">Admin Login</h2>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
          <input type="text" id="username" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Enter username">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
          <input type="password" id="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Enter password">
        </div>

        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200">
          Sign In
        </button>
      </form>

      <!-- Demo Credentials -->
      <div class="mt-6 p-4 bg-blue-50 border border-blue-200 rounded-lg">
        <p class="text-sm font-semibold text-blue-900 mb-2">Demo Credentials:</p>
        <p class="text-xs text-blue-800"><strong>Username:</strong> admin</p>
        <p class="text-xs text-blue-800"><strong>Password:</strong> capd2025</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="text-center mt-8">
      <p class="text-purple-100 text-sm">© 2025 CAPD Communications. All rights reserved.</p>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      // Simple authentication (in production, verify against backend)
      if (username === 'admin' && password === 'capd2025') {
        // Store session
        localStorage.setItem('adminUser', username);
        localStorage.setItem('loginTime', new Date().getTime());

        // Redirect to dashboard with absolute path
        window.location.href = '/admin/dashboard.html';
      } else {
        alert('Invalid credentials. Please try again.');
      }
    });
  </script>

</body>
</html>
